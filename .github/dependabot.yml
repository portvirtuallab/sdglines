version: 2
updates:
  # Application dependencies. Grouped so that a week of patch releases arrives
  # as one pull request rather than fifteen.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      tooling:
        patterns:
          - eslint*
          - '@typescript-eslint/*'
          - prettier*
          - vitest
          - '@playwright/*'
    commit-message:
      prefix: chore
      include: scope

  # The actions used by the workflows themselves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
