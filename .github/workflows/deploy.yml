name: Deploy to GitHub Pages

# Publishes the approved build from `main` to the GitHub Pages PREVIEW
# environment at https://portvirtuallab.github.io/sdglines/
#
# This workflow does NOT touch www.sdglines.com. The live website stays exactly
# where it is until the custom domain is pointed at GitHub Pages, which is a
# manual DNS change described in docs/custom-domain.md and requires explicit
# authorisation from the product owner.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued rather than cancelled, so that a deployment
# already uploading is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Validate content integrity
        run: npm run validate:content

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build:pages
        env:
          # The project site lives under /sdglines. To move to the custom
          # domain, change these two values and add a CNAME file. Nothing else
          # in the codebase has to change.
          SITE_URL: https://portvirtuallab.github.io
          BASE_PATH: /sdglines

      - name: Disable Jekyll processing
        # Without this, GitHub Pages ignores files and directories beginning
        # with an underscore, which silently breaks the Astro asset directory.
        run: touch dist/.nojekyll

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
