name: CI

# Runs on every pull request and on pushes to the long lived branches.
# The job has to pass before a pull request can be merged.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Only one run per branch. A new push cancels the run it supersedes, so the
# queue does not fill up with builds nobody is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm ci` installs exactly what the lockfile says, which is what makes
        # a CI result reproducible.
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate content integrity
        # Catches the class of error that type checking cannot: a route that
        # references a port id that does not exist, a vessel assigned to a
        # service that was renamed, a duplicate slug.
        run: npm run validate:content

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build:pages
        env:
          SITE_URL: https://portvirtuallab.github.io
          BASE_PATH: /sdglines

      - name: Upload the build for inspection
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: dist
          retention-days: 7

  accessibility:
    name: Accessibility and link checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build:pages
        env:
          SITE_URL: https://portvirtuallab.github.io
          BASE_PATH: /sdglines

      - name: Run the end to end and accessibility suite
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
